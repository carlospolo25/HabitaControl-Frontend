<div class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <header class="login-header">
      <img
        class="login-logo"
        src="assets/brand/SincroHabit.png"
        alt="SincroHabit"
      />
      
      <p>Bienvenido</p>
      <h1 id="login-title">Iniciar sesión</h1>
    </header>

    <section class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>

        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            (input)="clearError()"
            placeholder="admin@correo.com"
            autocomplete="email"
            [disabled]="isLoading">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            (input)="clearError()"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            [disabled]="isLoading">

          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
          Recordarme
        </label>

        <button type="button" class="link-button" (click)="forgotPassword()">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <button
        type="button"
        class="btn-login"
        (click)="login()"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <p *ngIf="errorMessage" class="error" role="alert">
        {{ errorMessage }}
      </p>
    </section>

    <footer class="persona-login-footer">
      <p>
        <a href="/documentos-legales/politica-tratamiento-datos-v1.0.pdf">Políticas de privacidad</a>
        y
        <a href="/documentos-legales/terminos-condiciones-v1.0.pdf">Términos de uso</a>.
      </p>
    </footer>
  </main>
</div>
