<div class="register-container">
  <div class="register-card">
    <header class="register-header">
      <img
        class="register-logo"
        src="assets/brand/logo-habitacontrol.png"
        alt="HabitaControl"
      />

      <h2>Crear cuenta de administrador</h2>
      <p class="subtitle">Configura tu conjunto residencial</p>
    </header>

    <form (ngSubmit)="register()" #registerForm="ngForm" novalidate>
      <section class="form-section">
        <h3>🏢 Datos del conjunto</h3>

        <div class="form-grid">
          <div class="form-group">
            <label for="tenantName">Nombre del conjunto</label>
            <input id="tenantName" type="text" name="tenantName" [(ngModel)]="tenantName" (input)="clearMessages()" required [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="tenantNit">NIT</label>
            <input id="tenantNit" type="text" name="tenantNit" [(ngModel)]="tenantNit" (input)="clearMessages()" required autocomplete="off" autocapitalize="off" spellcheck="false" [disabled]="isLoading"
            />
          </div>

          <div class="form-group">
            <label for="domain">Dominio</label>
            <input id="domain" type="text" name="domain" [(ngModel)]="domain" (input)="clearMessages()" placeholder="ej: conjunto-los-robles" [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="propertyType">Tipo de propiedad</label>
            <select id="propertyType" name="propertyType" [(ngModel)]="propertyType" (change)="clearMessages()" required [disabled]="isLoading">
              <option value="Conjunto residencial">Conjunto residencial</option>
              <option value="Edificio">Edificio</option>
              <option value="Condominio">Condominio</option>
              <option value="Urbanización">Urbanización</option>
            </select>
          </div>

          <div class="form-group">
            <label for="address">Dirección</label>
            <input id="address" type="text" name="address" [(ngModel)]="address" (input)="clearMessages()" required [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="city">Ciudad</label>
            <input id="city" type="text" name="city" [(ngModel)]="city" (input)="clearMessages()" required [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="companyPhone">Teléfono del conjunto</label>
            <input id="companyPhone" type="tel" name="companyPhone" [(ngModel)]="companyPhone" (input)="clearMessages()" [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="contactEmail">Email de contacto</label>
            <input id="contactEmail" type="email" name="contactEmail" [(ngModel)]="contactEmail" (input)="clearMessages()" autocomplete="email" [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="towerCount">Cantidad de torres</label>
            <input id="towerCount" type="number" name="towerCount" [(ngModel)]="towerCount" (input)="clearMessages()" min="1" [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="apartmentCount">Cantidad de apartamentos</label>
            <input id="apartmentCount" type="number" name="apartmentCount" [(ngModel)]="apartmentCount" (input)="clearMessages()" min="1" [disabled]="isLoading">
          </div>
        </div>
      </section>

      <section class="form-section">
        
        <h3>👤 Datos del administrador</h3>

        <div class="form-grid">
          <div class="form-group">
            <label for="adminName">Nombre completo</label>
            <input id="adminName" type="text" name="adminName" [(ngModel)]="adminName" (input)="clearMessages()" required autocomplete="name" [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="adminDocument">Documento</label>
            <input id="adminDocument" type="text" name="adminDocument" [(ngModel)]="adminDocument" (input)="clearMessages()" required [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="adminPhone">Teléfono</label>
            <input id="adminPhone" type="tel" name="adminPhone" [(ngModel)]="adminPhone" (input)="clearMessages()" autocomplete="tel" [disabled]="isLoading">
          </div>

          <div class="form-group">
            <label for="adminEmail">Email</label>
            <input id="adminEmail" type="email" name="adminEmail" [(ngModel)]="adminEmail" (input)="clearMessages()" required autocomplete="email" [disabled]="isLoading">
          </div>

          <div class="form-group full-width">
            <label for="password">Contraseña</label>

            <div class="input-wrapper">
              <span class="input-icon">🔒</span>

              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                (input)="clearMessages()"
                required
                autocomplete="new-password"
                [disabled]="isLoading">

              <button
                type="button"
                class="password-toggle"
                (click)="togglePasswordVisibility()"
                [disabled]="isLoading">
                {{ showPassword ? '🙈' : '👁' }}
              </button>
            </div>
          </div>
        </div>

        <div class="password-rules">
          <p [class.ok]="hasMinimumLength()">Mínimo 8 caracteres</p>
          <p [class.ok]="hasUppercase()">Una letra mayúscula</p>
          <p [class.ok]="hasLowercase()">Una letra minúscula</p>
          <p [class.ok]="hasNumber()">Un número</p>
          <p [class.ok]="hasSpecialCharacter()">Un carácter especial</p>
        </div>
      </section>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

      <div class="privacy-consent">

        <label class="checkbox-consent">
          <input
            type="checkbox"
            name="acceptPolicies"
            [(ngModel)]="acceptPolicies">

          <span>
            He leído y acepto la
            <button
              type="button"
              class="link-button"
              (click)="openPrivacyPolicy()">
              Política de Privacidad
            </button>
            y los
            <button
              type="button"
              class="link-button"
              (click)="openTerms()">
              Términos y Condiciones
            </button>.
          </span>

        </label>

      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="isLoading || !acceptPolicies">

        {{ isLoading ? 'Creando cuenta...' : 'Crear cuenta' }}

      </button>
    </form>
  </div>
</div>
