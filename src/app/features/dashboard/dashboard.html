<div class="admin-dashboard">

  <!-- =========================
       SIDEBAR
  ========================== -->
  <aside class="admin-dashboard__sidebar">

    <!-- Brand -->
    <header class="sidebar-brand">

      <div class="sidebar-brand__logo">

        <img
          class="sidebar-brand__logo-image"
          src="assets/brand/logo-habitacontrol.png"
          alt="Logo de HabitaControl">

      </div>

      <div class="sidebar-brand__content">

        <h1 class="sidebar-brand__title">
          HabitaControl
        </h1>

        <span class="sidebar-brand__subtitle">
          Panel administrativo
        </span>

      </div>

    </header>

    <!-- Navigation -->
    <nav
      class="sidebar-navigation"
      aria-label="Navegación principal">

      <div class="sidebar-navigation__list">

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarResumen"
          (click)="verResumen()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            ▣
          </span>

          <span class="sidebar-navigation__label">
            Resumen
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarPersonaComponent"
          (click)="mostrarPersonas()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            👥
          </span>

          <span class="sidebar-navigation__label">
            Personas
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarVisitanteComponent"
          (click)="mostrarVisitantes()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            🚶
          </span>

          <span class="sidebar-navigation__label">
            Visitantes
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarNovedadComponent"
          (click)="mostrarNovedades()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            ⚠
          </span>

          <span class="sidebar-navigation__label">
            Novedades
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarPaqueteComponent"
          (click)="mostrarPaquetes()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            📦
          </span>

          <span class="sidebar-navigation__label">
            Paquetes
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarReservaComponent"
          (click)="mostrarReservas()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            📅
          </span>

          <span class="sidebar-navigation__label">
            Reservas
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarZonasComunes"
          (click)="verZonasComunes()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            🏢
          </span>

          <span class="sidebar-navigation__label">
            Zonas comunes
          </span>

        </button>

        <button
          type="button"
          class="sidebar-navigation__item"
          [class.sidebar-navigation__item--active]="mostrarFinanzas"
          (click)="verFinanzas()">

          <span
            class="sidebar-navigation__icon"
            aria-hidden="true">
            💰
          </span>

          <span class="sidebar-navigation__label">
            Finanzas
          </span>

        </button>

      </div>

    </nav>

  </aside>


  <!-- =========================
       MAIN CONTENT
  ========================== -->
  <main class="admin-dashboard__main">

    <header class="dashboard-header">

      <div class="dashboard-header__content">

        <span class="dashboard-header__eyebrow">
          Administración
        </span>

        <h2 class="dashboard-header__title">
          Panel administrativo
        </h2>

        <p class="dashboard-header__description">
          Gestiona la operación diaria de tu conjunto residencial.
        </p>

      </div>

      <div class="dashboard-header__account-actions">

        <button
          type="button"
          class="dashboard-header__profile-button"
          [class.dashboard-header__profile-button--active]="mostrarPerfilUsuario"
          (click)="verPerfilUsuario()">

          <span
            class="dashboard-header__profile-icon"
            aria-hidden="true">
            👤
          </span>

          <span class="dashboard-header__profile-content">

            <span class="dashboard-header__profile-label">
              Mi perfil
            </span>

            <span class="dashboard-header__profile-description">
              Cuenta de administrador
            </span>

          </span>

        </button>

        <button
          type="button"
          class="dashboard-header__logout-button"
          (click)="logout()"
          aria-label="Cerrar sesión">

          <span
            class="dashboard-header__logout-icon"
            aria-hidden="true">
            ↪
          </span>

          <span class="dashboard-header__logout-label">
            Cerrar sesión
          </span>

        </button>

      </div>

    </header>


    <!-- Dynamic content -->
    <section
      class="dashboard-content"
      aria-live="polite">

      <div class="dashboard-content__view">

        <app-dashboard-overview
          *ngIf="mostrarResumen">
        </app-dashboard-overview>

        <app-persons
          *ngIf="mostrarPersonaComponent">
        </app-persons>

        <app-lista-visitantes
          *ngIf="mostrarVisitanteComponent">
        </app-lista-visitantes>

        <app-lista-novedades
          *ngIf="mostrarNovedadComponent"
          [esAdmin]="true"
          (iniciarSeguimiento)="verSegumiento($event)"
          (finalizarSeguimiento)="verFinalizacion($event)">
        </app-lista-novedades>

        <app-lista-paquetes
          *ngIf="mostrarPaqueteComponent">
        </app-lista-paquetes>

        <app-zonas-comunes
          *ngIf="mostrarZonasComunes">
        </app-zonas-comunes>

        <app-gestion-finanzas
          *ngIf="mostrarFinanzas">
        </app-gestion-finanzas>

        <app-gestion-reservas
          *ngIf="mostrarReservaComponent">
        </app-gestion-reservas>

        <app-perfil-usuario
          *ngIf="mostrarPerfilUsuario"
          (cerrar)="verResumen()">
        </app-perfil-usuario>

      </div>

    </section>

  </main>

</div>
